name: Tests

on:
  pull_request:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run arraysDiff test
        run: node --test src/tests/420-diff-algorithm.test.js

      - name: Check userscript metadata version
        shell: bash
        run: |
          version_pattern='^//[[:space:]]*@version[[:space:]]+[^[:space:]]+[[:space:]]*$'
          test "$(grep -cE "$version_pattern" misc/better-osm-org.meta.js)" -eq 1
          diff -u \
            <(grep -E "$version_pattern" misc/better-osm-org.meta.js) \
            <(grep -E "$version_pattern" better-osm-org.user.js)

      - name: Validate translations
        run: node --test src/tests/020-i18n.test.js

#      - name: Run way geometry validator test
#        run: node --test src/tests/110-geometry-validator.test.js

      - name: Ensure localhost @match is absent
        run: |
          if grep -Fq 'http://localhost:3000/*' better-osm-org.user.js; then
            echo 'Forbidden @match found in better-osm-org.user.js. Only for local development'
            exit 1
          fi
